name: Android stress test APK

on:
  workflow_dispatch:
  push:
    branches: [main, "gpt/**", "claude/**"]
    paths:
      - "godot/**"
      - ".github/workflows/android-stress.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GODOT_VERSION: "4.4.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"

      - name: Configure Godot for Android export
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT

      - name: Import project and export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.github/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p godot/build
          godot --headless --path godot --import || true
          godot --headless --path godot --export-debug "Android" build/crown-rush-stress.apk
          ls -la godot/build

      - uses: actions/upload-artifact@v4
        with:
          name: crown-rush-stress-apk
          path: godot/build/crown-rush-stress.apk

      - name: Publish as GitHub release (direct APK download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="stress-latest"
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            TAG="build-$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" godot/build/crown-rush-stress.apk \
            --target "$GITHUB_SHA" \
            --prerelease --title "Build: $GITHUB_REF_NAME" \
            --notes "Автоматична збірка гілки $GITHUB_REF_NAME, коміт $GITHUB_SHA. Встановити APK на Android."
