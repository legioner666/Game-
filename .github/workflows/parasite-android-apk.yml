name: Parasite Evolution — Android debug APK (manual, needs Unity license)

# Manual only. Builds an ARM64 IL2CPP debug APK with GameCI on a free standard GitHub-hosted runner
# (free for public repositories). It does nothing unless the repository owner has added the official
# Unity Personal license secrets: UNITY_LICENSE (.ulf contents), UNITY_EMAIL, UNITY_PASSWORD.
# No license is generated, bypassed or shared by this workflow. See parasite-evolution/BUILD_WITHOUT_PC.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parasite-android-apk
  cancel-in-progress: false

jobs:
  license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check that the owner configured Unity license secrets
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Unity license secrets are not configured"
              echo "The APK job was skipped. Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository"
              echo "secrets (Settings → Secrets and variables → Actions). Steps: parasite-evolution/BUILD_WITHOUT_PC.md."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  android-apk:
    needs: license-check
    if: needs.license-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The Unity Android editor image (unityci/editor:ubuntu-6000.3.11f1-android-3) is ~8.7 GB
      # compressed; the default runner disk is too small without cleanup.
      - name: Free disk space on the runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true

      - name: Check out sources
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: parasite-evolution/Library
          key: parasite-library-android-${{ hashFiles('parasite-evolution/Packages/**', 'parasite-evolution/ProjectSettings/**', 'parasite-evolution/Assets/**') }}
          restore-keys: |
            parasite-library-android-

      - name: Build ARM64 debug APK (Unity 6000.3.11f1, IL2CPP)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: parasite-evolution
          unityVersion: 6000.3.11f1
          targetPlatform: Android
          buildName: ParasiteEvolution-debug
          buildMethod: ParasiteEvolution.Editor.PrototypeBuild.BuildAndroidCI
          androidExportType: androidPackage
          androidSymbolType: none
          versioning: None

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ParasiteEvolution-debug-apk
          path: |
            build/Android/**/*.apk
            parasite-evolution/Builds/*.apk
          if-no-files-found: error
          retention-days: 14
